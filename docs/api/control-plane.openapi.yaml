      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo/confirmations/{id}/decide:
    post:
      operationId: decideConfirmation
      tags:
      - approval
      summary: 处理调用确认（approval 需具备 approver_role 且不是被代表用户；user_confirm 只能本人）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoDecideResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDecision'
  /api/v1/todo/tasks/{id}/decide:
    post:
      operationId: decideTask
      tags:
      - approval
      summary: 处理 Workflow 人工任务（确认、审批、补录）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoDecideResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDecision'
  /api/v1/runs/{id}:
    get:
      operationId: getRunConsole
      tags:
      - approval
      summary: 控制台查看 Workflow Run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunConsoleView'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/audit-logs:
    get:
      operationId: searchAudit
      tags:
      - audit
      summary: 审计检索（按时间倒序；分公司管理员只看本公司）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsoleAuditRecord'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      - name: trace_id
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
  /api/v1/internal/events:
    post:
      operationId: ingestDataPlaneEvents
      tags:
      - snapshot
      summary: 数据面事件回传（服务凭据）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/snapshots/iam:
    get:
      operationId: pullIamSnapshot
      tags:
      - snapshot
      summary: 数据面拉取 IAM 快照
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/AfterSeq'
      - $ref: '#/components/parameters/WaitS'
  /api/v1/snapshots/release:
    get:
      operationId: pullReleaseSnapshot
      tags:
      - snapshot
      summary: 数据面拉取发布快照
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/AfterSeq'
      - $ref: '#/components/parameters/WaitS'
components:
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    ExternalId:
      name: external_id
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AfterSeq:
      name: after_seq
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    WaitS:
      name: wait_s
      in: query
      description: 长轮询等待秒数（0 到 25）
      schema:
        type: number
        minimum: 0
        maximum: 25
        default: 0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    Health:
      type: object
      properties:
        status:
          enum:
          - ok
          - degraded
        service:
          type: string
        version:
          type: string
        checks:
