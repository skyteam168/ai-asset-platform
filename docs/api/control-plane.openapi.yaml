openapi: 3.1.0
info:
  title: AIP Control Plane API
  version: 0.1.0
  description: 控制面：IAM、资产、发布、授权、连接、审批、审计。约定见 conventions.md，错误码见 error-codes.md。
servers:
- url: https://api.example-group.internal
security:
- bearer: []
tags:
- name: approval
- name: audit
- name: auth
- name: connection
- name: grant
- name: iam
- name: ops
- name: registry
- name: release
- name: snapshot
paths:
  /healthz:
    get:
      operationId: cpHealth
      tags:
      - ops
      summary: 存活检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: 本地登录（密码 + TOTP）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: 注销会话
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: me
      tags:
      - auth
      summary: 当前用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/orgs:
    get:
      operationId: listOrgs
      tags:
      - iam
      summary: 组织列表（按生效节点范围）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createOrg
      tags:
      - iam
      summary: 新建组织节点
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}:
    get:
      operationId: getOrg
      tags:
      - iam
      summary: 组织详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateOrg
      tags:
      - iam
      summary: 修改组织
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}/move:
    post:
      operationId: moveOrg
      tags:
      - iam
      summary: 迁移组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitMove'
  /api/v1/orgs/{id}/disable:
    post:
      operationId: disableOrg
      tags:
      - iam
      summary: 停用组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - iam
      summary: 用户列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createUser
      tags:
      - iam
      summary: 新建用户
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/import:
    post:
      operationId: importUsers
      tags:
      - iam
      summary: 批量导入用户（支持 dry_run）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
      - iam
      summary: 用户详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateUser
      tags:
      - iam
      summary: 修改用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/{id}/roles:
    post:
      operationId: assignRole
      tags:
      - iam
      summary: 分配角色
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
  /api/v1/clearance-requests:
    post:
      operationId: requestClearance
      tags:
      - iam
      summary: 申请提升密级
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceRequest'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearanceRequest'
  /api/v1/clearance-requests/{id}/decide:
    post:
      operationId: decideClearance
      tags:
      - iam
      summary: 审批密级申请
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceRequest'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
  /api/v1/consumers:
    get:
      operationId: listConsumers
      tags:
      - iam
      summary: 消费方列表
      responses:
        '200':
          description: OK
