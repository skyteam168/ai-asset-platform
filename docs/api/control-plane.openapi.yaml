      properties:
        login_name:
          type: string
        password:
          type: string
          format: password
        totp:
          type:
          - string
          - 'null'
      required:
      - login_name
      - password
    OidcCallbackRequest:
      type: object
      properties:
        id_token:
          type: string
      required:
      - id_token
    AuthProviderInfo:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
      required:
      - name
      - enabled
