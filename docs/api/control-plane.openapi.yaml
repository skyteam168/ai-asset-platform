openapi: 3.1.0
info:
  title: AIP Control Plane API
  version: 0.1.0
  description: 控制面：IAM、资产、发布、授权、连接、审批、审计。约定见 conventions.md，错误码见 error-codes.md。
servers:
- url: https://api.example-group.internal
security:
- bearer: []
tags:
- name: approval
- name: audit
- name: auth
- name: catalog
- name: connection
- name: grant
- name: iam
- name: importer
- name: llm
- name: ops
- name: registry
- name: release
- name: risk
- name: skill
- name: snapshot
- name: testlab
- name: webhook
paths:
  /healthz:
    get:
      operationId: cpHealth
      tags:
      - ops
      summary: 存活检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: 本地登录（密码 + TOTP）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: 注销会话
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: me
      tags:
      - auth
      summary: 当前用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/orgs:
    get:
      operationId: listOrgs
      tags:
      - iam
      summary: 组织列表（按生效节点范围）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createOrg
      tags:
      - iam
      summary: 新建组织节点
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}:
    get:
      operationId: getOrg
      tags:
      - iam
      summary: 组织详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateOrg
      tags:
      - iam
      summary: 修改组织
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}/move:
    post:
      operationId: moveOrg
      tags:
      - iam
      summary: 迁移组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitMove'
  /api/v1/orgs/{id}/disable:
    post:
      operationId: disableOrg
      tags:
      - iam
      summary: 停用组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - iam
      summary: 用户列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createUser
      tags:
      - iam
      summary: 新建用户
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/import/{id}/rollback:
    post:
      operationId: rollbackImport
      tags:
      - iam
      summary: 按批次回滚导入（未使用的删除，已使用的停用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users/import:
    post:
      operationId: importUsers
      tags:
      - iam
      summary: 批量导入用户（支持 dry_run）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
      - iam
      summary: 用户详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateUser
      tags:
      - iam
      summary: 修改用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/{id}/roles:
    post:
      operationId: assignRole
      tags:
      - iam
      summary: 分配角色
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
  /api/v1/clearance-requests:
    post:
      operationId: requestClearance
      tags:
      - iam
      summary: 申请提升密级
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceRequest'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearanceRequest'
  /api/v1/clearance-requests/{id}/decide:
    post:
      operationId: decideClearance
      tags:
      - iam
      summary: 审批密级申请
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceRequest'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
  /api/v1/consumers:
    get:
      operationId: listConsumers
      tags:
      - iam
      summary: 消费方列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consumer'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createConsumer
      tags:
      - iam
      summary: 注册消费方
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consumer'
  /api/v1/consumers/{id}/credentials:
    post:
      operationId: issueCredential
      tags:
      - iam
      summary: 签发消费方凭据
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssued'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
  /api/v1/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      tags:
      - iam
      summary: 吊销凭据
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/consumers/{id}/jwks:
    post:
      operationId: addConsumerJwk
      tags:
      - iam
      summary: 登记用户断言验签公钥
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwk'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
  /api/v1/consumers/{id}/bindings:
    get:
      operationId: listBindings
      tags:
      - iam
      summary: 用户绑定列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBinding'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createBinding
      tags:
      - iam
      summary: 新建用户绑定
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBinding'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBinding'
  /api/v1/assertion-debug:
    post:
      operationId: debugAssertion
      tags:
      - iam
      summary: 断言调试器（不落日志）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionDebugResult'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionDebugRequest'
  /api/v1/assets:
    get:
      operationId: listAssets
      tags:
      - registry
      summary: 资产列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createAsset
      tags:
      - registry
      summary: 新建资产
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
  /api/v1/versions/{id}/submit:
    post:
      operationId: submitVersion
      tags:
      - release
      summary: 提交门禁
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersion'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/versions/{id}/test-cases:
    post:
      operationId: addTestCase
      tags:
      - release
      summary: 添加门禁用例（功能 / 权限）
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/versions/{id}/acceptance:
    put:
      operationId: setAcceptance
      tags:
      - release
      summary: 设置验收单模板（G5）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/versions/{id}/run-tests:
    post:
      operationId: runTests
      tags:
      - release
      summary: Test Lab 执行 G1–G4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/versions/{id}/gates:
    get:
      operationId: gateHistory
      tags:
      - release
      summary: 门禁记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/versions/{id}/impact:
    get:
      operationId: listVersionImpact
      tags:
      - release
      summary: G4 依赖影响：列出需回归的上层资产
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/versions/{id}/canary:
    post:
      operationId: startCanary
      tags:
      - release
      summary: G7 灰度发布
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/versions/{id}/promote:
    post:
      operationId: promoteVersion
      tags:
      - release
      summary: G7 指标达标后全量（G8）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/approval-delegates:
    post:
      operationId: addApprovalDelegate
      tags:
      - approval
      summary: 设置审批代理人
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/access-reviews:
    post:
      operationId: openAccessReview
      tags:
      - grant
      summary: 发起授权复核活动
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/access-reviews/{id}/close:
    post:
      operationId: closeAccessReview
      tags:
      - grant
      summary: 关闭复核（未确认的授权撤销）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/assets/{id}/versions:
    get:
      operationId: listVersions
      tags:
      - registry
      summary: 资产的版本列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createVersion
      tags:
      - registry
      summary: 新建资产版本
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersion'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetVersion'
  /api/v1/versions/{id}:
    get:
      operationId: getVersion
      tags:
      - registry
      summary: 版本详情（含用例与验收单）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/grant-ceilings:
    get:
      operationId: listCeilings
      tags:
      - grant
      summary: 授权上限列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCeiling
      tags:
      - grant
      summary: 设置授权上限
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantCeiling'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCeiling'
  /api/v1/usage-requests:
    get:
      operationId: listUsageRequests
      tags:
      - grant
      summary: 使用申请列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestUsage
      tags:
      - grant
      summary: 使用申请（上限内，由本公司管理员审批）
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/audit-logs/verify:
    post:
      operationId: verifyAudit
      tags:
      - audit
      summary: 校验审计哈希链与锚点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/releases:
    post:
      operationId: createRelease
