          - consumer
          - agent_profile
          - org_unit
          - user
        grantee_id:
          type: string
        env:
          type: string
        expires_at:
          type: string
          format: date-time
        ceiling_id:
          type: string
      required:
      - asset_id
      - grantee_type
      - grantee_id
      - env
      - expires_at
    SystemConnection:
      $ref: ../specs/system-connection.schema.json
    ConnectionTestResult:
      type: object
      properties:
        connection_id:
          type: string
        resolved_ip:
          type:
          - string
          - 'null'
        allowlisted:
          type: boolean
        tls_version:
          type:
          - string
          - 'null'
        chain:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
              issuer:
                type: string
              not_before:
                type: string
                format: date-time
              not_after:
                type: string
                format: date-time
        fingerprint_cert_sha256:
          type:
          - string
          - 'null'
        fingerprint_spki_sha256:
          type:
          - string
          - 'null'
        hostname_match:
          type:
          - boolean
          - 'null'
        verdict:
          enum:
          - pass
          - fail
        error_code:
          type:
          - string
          - 'null'
        detail:
          type:
          - string
          - 'null'
      required:
      - connection_id
      - verdict
    ConfigDraft:
      type: object
      properties:
        tls_mode:
          enum:
          - custom_ca
          - pinned
        pins:
          type: array
          items:
            type: object
        ca_pem:
          type:
          - string
          - 'null'
        approval_id:
          type: string
    Approval:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        kind:
          type: string
        subject_ref:
          type: string
        status:
          type: string
        steps:
          type: array
          items:
            type: object
    AuditRecord:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
        action:
          type: string
        target:
          type: string
        decision:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        trace_id:
          type:
          - string
          - 'null'
        shard_id:
          type: string
        seq:
