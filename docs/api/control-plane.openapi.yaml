      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createBinding
      tags:
      - iam
      summary: 新建用户绑定
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
