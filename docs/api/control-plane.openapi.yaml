        hash:
          type: string
    Snapshot:
      type: object
      properties:
        kind:
          enum:
          - iam
          - release
        seq:
          type: integer
        full:
          type: boolean
        sha256:
          type: string
        signature:
          type: string
        payload_url:
          type: string
      required:
      - kind
      - seq
      - full
      - sha256
      - signature
