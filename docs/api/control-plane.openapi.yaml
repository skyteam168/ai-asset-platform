openapi: 3.1.0
info:
  title: AIP Control Plane API
  version: 0.1.0
  description: 控制面：IAM、资产、发布、授权、连接、审批、审计。约定见 conventions.md，错误码见 error-codes.md。
servers:
- url: https://api.example-group.internal
security:
- bearer: []
tags:
- name: approval
- name: audit
- name: auth
- name: catalog
- name: connection
- name: gates
- name: grant
- name: iam
- name: importer
- name: llm
- name: notify
- name: ops
- name: registry
- name: release
- name: risk
- name: skill
- name: snapshot
- name: testlab
- name: webhook
paths:
  /healthz:
    get:
      operationId: cpHealth
      tags:
      - ops
      summary: 存活检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: 本地登录（密码 + TOTP）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: 注销会话
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags:
      - auth
      summary: 已登记的登录插件（local / oidc 等）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProviderInfo'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/auth/oidc/callback:
    post:
      operationId: oidcCallback
      tags:
      - auth
      summary: OIDC 回调（stub：id_token=stub:<sub>；经 external_login 映射）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcCallbackRequest'
      security: []
  /api/v1/me:
    get:
      operationId: me
      tags:
      - auth
      summary: 当前用户（含生效角色）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/orgs:
    get:
      operationId: listOrgs
      tags:
      - iam
      summary: 组织列表（按生效节点范围）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createOrg
      tags:
      - iam
      summary: 新建组织节点
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}:
    get:
      operationId: getOrg
      tags:
      - iam
      summary: 组织详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateOrg
      tags:
      - iam
      summary: 修改组织
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitCreate'
  /api/v1/orgs/{id}/move:
    post:
      operationId: moveOrg
      tags:
      - iam
      summary: 迁移组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitMove'
  /api/v1/orgs/{id}/disable:
    post:
      operationId: disableOrg
      tags:
      - iam
      summary: 停用组织节点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - iam
      summary: 用户列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createUser
      tags:
      - iam
      summary: 新建用户
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/import/{id}/rollback:
    post:
      operationId: rollbackImport
      tags:
      - iam
      summary: 按批次回滚导入（未使用的删除，已使用的停用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRollback'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users/import:
    post:
      operationId: importUsers
      tags:
      - iam
      summary: 批量导入用户（支持 dry_run）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
      - iam
      summary: 用户详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateUser
      tags:
      - iam
      summary: 修改用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /api/v1/users/{id}/roles:
    get:
      operationId: listUserRoles
      tags:
      - iam
      summary: 用户角色列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleAssignment'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: assignRole
      tags:
      - iam
      summary: 分配角色（平台角色或本公司业务角色）
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
  /api/v1/users/{id}/external-logins:
    get:
      operationId: listExternalLogins
      tags:
      - iam
      summary: 用户外部登录绑定列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalLogin'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: bindExternalLogin
      tags:
      - iam
      summary: 绑定外部登录主体（OIDC/SAML → iam_user）
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLogin'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLoginBind'
  /api/v1/users/{id}/external-logins/{provider}/{external_id}:
    delete:
      operationId: unbindExternalLogin
      tags:
      - iam
      summary: 解绑外部登录
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/ExternalId'
  /api/v1/users/{id}/webauthn/credentials:
    get:
      operationId: listWebAuthnCredentials
      tags:
      - auth
      summary: 已登记的 WebAuthn 凭证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebAuthnCredential'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users/{id}/webauthn/register/begin:
    post:
      operationId: webauthnRegisterBegin
      tags:
      - auth
      summary: 开始 WebAuthn 注册（返回 PublicKeyCredentialCreationOptions）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/users/{id}/webauthn/register/finish:
    post:
      operationId: webauthnRegisterFinish
      tags:
      - auth
      summary: 完成 WebAuthn 注册（stub 跳过 attestation）
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnCredential'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
  /api/v1/auth/webauthn/authenticate/begin:
    post:
      operationId: webauthnAuthenticateBegin
      tags:
      - auth
      summary: 开始 WebAuthn 认证挑战
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAuthBeginRequest'
      security: []
  /api/v1/auth/webauthn/authenticate/finish:
    post:
      operationId: webauthnAuthenticateFinish
      tags:
      - auth
      summary: 完成 WebAuthn 认证（stub）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAuthFinishRequest'
      security: []
  /api/v1/companies/{id}/business-roles:
    get:
      operationId: listBusinessRoles
      tags:
      - iam
      summary: 公司业务角色列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessRole'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createBusinessRole
      tags:
      - iam
      summary: 登记公司业务角色
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessRole'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessRoleCreate'
  /api/v1/companies/{id}/business-roles/{code}:
    delete:
      operationId: deleteBusinessRole
      tags:
      - iam
      summary: 删除公司业务角色
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/clearance-requests:
    get:
      operationId: listClearanceRequests
      tags:
      - iam
      summary: 密级申请列表（默认 pending）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClearanceRequest'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestClearance
      tags:
      - iam
      summary: 申请提升密级
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceRequest'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearanceRequest'
  /api/v1/clearance-requests/{id}/decide:
    post:
      operationId: decideClearance
      tags:
      - iam
      summary: 审批密级申请
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceDecision'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
  /api/v1/consumers:
    get:
      operationId: listConsumers
      tags:
      - iam
      summary: 消费方列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consumer'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createConsumer
      tags:
      - iam
      summary: 注册消费方
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consumer'
  /api/v1/consumers/{id}/credentials:
    get:
      operationId: listCredentials
      tags:
      - iam
      summary: 消费方凭据元数据列表（不含明文）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialMeta'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: issueCredential
      tags:
      - iam
      summary: 签发消费方凭据
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssued'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
  /api/v1/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      tags:
      - iam
      summary: 吊销凭据
      responses:
        '204':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/consumers/{id}/jwks:
    post:
      operationId: addConsumerJwk
      tags:
      - iam
      summary: 登记用户断言验签公钥
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwk'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
  /api/v1/consumers/{id}/bindings:
    get:
      operationId: listBindings
      tags:
      - iam
      summary: 用户绑定列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBinding'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createBinding
      tags:
      - iam
      summary: 新建用户绑定
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBinding'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBinding'
  /api/v1/assertion-debug:
    post:
      operationId: debugAssertion
      tags:
      - iam
      summary: 断言调试器（不落日志）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionDebugResult'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionDebugRequest'
  /api/v1/assets:
    get:
      operationId: listAssets
      tags:
      - registry
