                      type: object
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo/confirmations/{id}/decide:
    post:
      operationId: decideConfirmation
      tags:
      - approval
      summary: 处理调用确认（approval 需具备 approver_role 且不是被代表用户；user_confirm 只能本人）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDecision'
  /api/v1/todo/tasks/{id}/decide:
    post:
      operationId: decideTask
      tags:
      - approval
      summary: 处理 Workflow 人工任务（确认、审批、补录）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDecision'
  /api/v1/runs/{id}:
    get:
      operationId: getRunConsole
      tags:
      - approval
      summary: 控制台查看 Workflow Run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/audit-logs:
    get:
      operationId: searchAudit
      tags:
      - audit
      summary: 审计检索（按时间倒序；分公司管理员只看本公司）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRecord'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      - name: trace_id
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
  /api/v1/internal/events:
    post:
      operationId: ingestDataPlaneEvents
      tags:
      - snapshot
      summary: 数据面事件回传（服务凭据）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/snapshots/iam:
    get:
      operationId: pullIamSnapshot
      tags:
      - snapshot
      summary: 数据面拉取 IAM 快照
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/AfterSeq'
      - $ref: '#/components/parameters/WaitS'
  /api/v1/snapshots/release:
    get:
      operationId: pullReleaseSnapshot
      tags:
      - snapshot
      summary: 数据面拉取发布快照
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/AfterSeq'
      - $ref: '#/components/parameters/WaitS'
components:
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AfterSeq:
      name: after_seq
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    WaitS:
      name: wait_s
      in: query
      description: 长轮询等待秒数（0 到 25）
      schema:
        type: number
        minimum: 0
        maximum: 25
        default: 0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    Health:
      type: object
      properties:
        status:
          enum:
          - ok
          - degraded
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - status
      - service
    LoginRequest:
      type: object
      properties:
        login_name:
          type: string
        password:
          type: string
          format: password
        totp:
          type:
          - string
          - 'null'
      required:
      - login_name
      - password
    Session:
      type: object
      properties:
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
      required:
      - session_token
      - expires_at
      - user
    OrgUnit:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        type:
          enum:
          - group
          - company
          - department
          - team
        code:
          type: string
        name:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        company_id:
          type: string
        default_clearance:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 4
        timezone:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
        status:
          enum:
          - active
          - disabled
        valid_from:
          type: string
          format: date-time
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - type
      - code
      - name
      - company_id
      - status
    OrgUnitCreate:
      type: object
      properties:
        type:
          enum:
          - company
          - department
          - team
        code:
          type: string
        name:
          type: string
        parent_id:
          type: string
        default_clearance:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 4
        timezone:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
      required:
      - type
      - code
      - name
      - parent_id
    OrgUnitMove:
      type: object
      properties:
        new_parent_id:
          type: string
      required:
      - new_parent_id
    User:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        login_name:
          type:
          - string
          - 'null'
        display_name:
          type: string
        employee_no:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        home_org_id:
          type: string
        login_enabled:
          type: boolean
        status:
          enum:
          - active
          - disabled
          - left
        effective_clearance:
          type: integer
          minimum: 1
          maximum: 4
        totp_provisioning_uri:
          type:
          - string
          - 'null'
          description: 仅创建可登录用户时返回一次
        timezone:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
      required:
      - id
      - display_name
      - home_org_id
      - login_enabled
      - status
    UserCreate:
      type: object
      properties:
        login_name:
          type:
          - string
          - 'null'
        display_name:
          type: string
        employee_no:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        home_org_id:
          type: string
        login_enabled:
          type: boolean
        password:
          type:
          - string
          - 'null'
      required:
      - display_name
      - home_org_id
    ImportRequest:
      type: object
      properties:
        format:
          enum:
          - csv
        content:
          type: string
        dry_run:
          type: boolean
      required:
      - format
      - content
    ImportResult:
      type: object
      properties:
        batch_id:
          type: string
        dry_run:
          type: boolean
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              message:
                type: string
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        user_id:
          type: string
        role:
          enum:
          - platform_admin
          - asset_developer
          - data_owner
          - business_owner
          - company_admin
          - auditor
        scope_org_id:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - user_id
      - role
      - scope_org_id
    ClearanceRequest:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        user_id:
          type: string
        requested_level:
          type: integer
          minimum: 1
          maximum: 4
        reason:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          enum:
          - pending
          - approved
          - rejected
      required:
      - user_id
      - requested_level
      - reason
      - expires_at
    Decision:
      type: object
      properties:
        decision:
          enum:
          - approve
          - reject
        comment:
          type: string
      required:
      - decision
    Note:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
    Quota:
      type: object
      properties:
        daily_calls:
          type: integer
          minimum: 1
        daily_writes:
          type: integer
          minimum: 1
    RiskRule:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          enum:
          - audit
          - domain
        params:
          type: object
        action:
          enum:
          - alert
          - suspend_asset
        severity:
          enum:
          - low
          - medium
          - high
        enabled:
          type: boolean
      required:
      - code
      - params
      - action
    RiskRulePatch:
      type: object
      properties:
        params:
          type: object
        enabled:
          type: boolean
        action:
          enum:
          - alert
          - suspend_asset
        severity:
          enum:
          - low
          - medium
          - high
    RiskEvent:
      type: object
      properties:
        id:
          type: string
        rule_code:
          type: string
        rule_name:
          type: string
        company_id:
          type:
          - string
          - 'null'
        group_key:
          type: object
        observed:
          type: number
        threshold:
          type: number
        severity:
          type: string
        action:
          type: string
        action_result:
          type: object
        status:
          enum:
          - open
          - acknowledged
          - resume_requested
          - resolved
      required:
      - id
      - rule_code
      - status
    TodoDecision:
      type: object
      properties:
        decision:
          enum:
          - approve
          - reject
        comment:
          type: string
        data:
          type: object
      required:
      - decision
    Consumer:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        client_id:
          type: string
        company_id:
          type: string
        clearance_cap:
          type: integer
          minimum: 1
          maximum: 4
        bind_policy:
          enum:
          - strict
          - by_employee_no
          - app_only
        status:
          type: string
        contact:
          type: string
      required:
      - client_id
      - company_id
      - clearance_cap
      - bind_policy
    CredentialCreate:
      type: object
      properties:
        kind:
          enum:
          - static_token
          - private_key_jwt
        expires_at:
          type: string
          format: date-time
        ip_binding:
          type: array
          items:
            type: string
      required:
      - kind
    CredentialIssued:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        kind:
          type: string
        token:
          type:
          - string
          - 'null'
          description: 仅创建时返回一次
        expires_at:
          type: string
          format: date-time
    Jwk:
      type: object
      properties:
        kid:
          type: string
        kty:
          type: string
        crv:
          type: string
        x:
          type: string
        y:
          type: string
        n:
          type: string
        e:
          type: string
        alg:
          type: string
      required:
      - kid
      - kty
    UserBinding:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        consumer_id:
          type: string
        external_subject:
          type: string
        user_id:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - consumer_id
      - external_subject
      - user_id
    AssertionDebugRequest:
      type: object
      properties:
        consumer_id:
          type: string
        assertion:
          type: string
      required:
      - consumer_id
      - assertion
    AssertionDebugResult:
      type: object
      properties:
        signature_valid:
          type: boolean
        claims_valid:
          type: boolean
        binding:
          type:
          - string
          - 'null'
        errors:
          type: array
          items:
            type: string
        principal:
          type:
          - object
          - 'null'
    Asset:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        type:
          enum:
          - tool
          - skill
          - workflow
          - bundle
          - prompt
          - model_profile
          - connector_package
        name:
          type: string
        owner_org_id:
          type: string
        owner_user_id:
          type: string
        classification:
          type: integer
          minimum: 1
          maximum: 4
      required:
      - type
      - name
      - owner_org_id
      - classification
    AssetVersion:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        asset_id:
          type: string
        semver:
          type: string
        content_hash:
          type: string
        spec:
          type: object
        state:
          enum:
          - draft
          - testing
          - in_review
          - approved
          - canary
          - active
          - deprecated
          - retired
          - suspended
      required:
      - semver
      - spec
    Release:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        version_id:
          type: string
        env:
          enum:
          - test
          - staging
          - prod
        scope:
          type: object
        channel:
          enum:
          - beta
          - stable
        exposure:
          type: array
          items:
            enum:
            - rest
            - mcp
            - a2a
        status:
          type: string
      required:
      - version_id
      - env
      - scope
      - channel
    GrantCeiling:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        company_id:
          type: string
        asset_set:
          type: object
        max_classification:
          type: integer
          minimum: 1
          maximum: 4
        quota:
          type: object
      required:
      - company_id
      - asset_set
      - max_classification
    Grant:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7
        asset_id:
          type: string
        grantee_type:
          enum:
          - consumer
          - agent_profile
          - org_unit
          - user
        grantee_id:
          type: string
        env:
          type: string
        expires_at:
          type: string
          format: date-time
        ceiling_id:
          type: string
      required:
      - asset_id
      - grantee_type
      - grantee_id
      - env
      - expires_at
    SystemConnection:
      $ref: ../specs/system-connection.schema.json
    ConnectionTestResult:
      type: object
      properties:
        connection_id:
          type: string
        resolved_ip:
