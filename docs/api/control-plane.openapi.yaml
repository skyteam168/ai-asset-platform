          type: string
          description: UUIDv7
        names:
          type: array
          items:
            type: string
      required:
      - company_id
      - names
    LlmAllowlistPut:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
      required:
      - names
    LlmBudget:
      type: object
      properties:
        company_id:
          type: string
          description: UUIDv7
        daily_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - company_id
      - daily_tokens
    LlmBudgetPut:
      type: object
      properties:
        daily_tokens:
          type: integer
          minimum: 0
      required:
      - daily_tokens
    LlmUsage:
      type: object
      properties:
        company_id:
          type: string
          description: UUIDv7
        usage_date:
          type: string
          format: date
        tokens_used:
          type: integer
          minimum: 0
        daily_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
