openapi: 3.1.0
info:
  title: AIP Data Plane API
  version: 0.1.0
  description: 数据面：OAuth 令牌、目录、统一调用、确认、MCP。约定见 conventions.md，错误码见 error-codes.md。
servers:
- url: https://api.example-group.internal
security:
- bearer: []
tags:
- name: catalog
- name: confirmation
- name: internal
- name: invoke
- name: mcp
- name: oauth
- name: ops
paths:
  /healthz:
    get:
      operationId: dpHealth
      tags:
      - ops
      summary: 存活检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /readyz:
    get:
      operationId: dpReady
      tags:
      - ops
      summary: 就绪检查（快照与策略已加载）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /.well-known/oauth-protected-resource:
    get:
      operationId: protectedResourceMetadata
      tags:
      - oauth
      summary: RFC 9728
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /.well-known/oauth-authorization-server:
    get:
      operationId: authorizationServerMetadata
      tags:
      - oauth
      summary: RFC 8414
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /.well-known/jwks.json:
    get:
      operationId: jwks
      tags:
      - oauth
      summary: 平台令牌验签公钥
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /oauth/token:
    post:
      operationId: token
      tags:
      - oauth
      summary: client_credentials 与 RFC 7523 jwt-bearer 令牌交换
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/catalog:
    get:
      operationId: catalog
      tags:
      - catalog
      summary: 按 Principal 过滤的能力目录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/invoke/{capability_id}:
    post:
      operationId: invoke
      tags:
      - invoke
      summary: 调用 Tool（统一执行链）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-User-Assertion
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
  /api/v1/executions/{id}:
    get:
      operationId: getExecution
      tags:
      - invoke
      summary: 查询执行结果
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/runs/{id}:
    get:
      operationId: getRun
      tags:
      - invoke
      summary: 查询 Workflow Run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/internal/todo:
    post:
      operationId: internalTodo
      tags:
      - internal
      summary: 内部（服务凭据）：待处理的确认与人工任务，按公司过滤
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_ids:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
  /api/v1/internal/confirmations/{id}:
    get:
      operationId: internalGetConfirmation
      tags:
      - internal
      summary: 内部（服务凭据）：确认摘要
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/internal/confirmations/{id}/decide:
    post:
      operationId: internalDecideConfirmation
      tags:
      - internal
      summary: 内部（服务凭据）：控制台审批后执行或拒绝
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalDecision'
  /api/v1/internal/tasks/{id}:
    get:
      operationId: internalGetTask
      tags:
      - internal
      summary: 内部（服务凭据）：人工任务
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/internal/tasks/{id}/decide:
    post:
      operationId: internalDecideTask
      tags:
      - internal
      summary: 内部（服务凭据）：处理人工任务
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalDecision'
  /api/v1/internal/runs/{id}:
    get:
      operationId: internalGetRun
      tags:
      - internal
      summary: 内部（服务凭据）：Run 全量视图
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/confirmations/{id}/confirm:
    post:
      operationId: confirm
      tags:
      - confirmation
      summary: 确认（需同一用户的新断言）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
  /api/v1/confirmations/{id}/reject:
    post:
      operationId: rejectConfirmation
      tags:
      - confirmation
      summary: 拒绝确认
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
  /mcp:
    post:
      operationId: mcp
      tags:
      - mcp
      summary: MCP Streamable HTTP（JSON-RPC，协议 2025-11-25 与 2026-07-28）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC 响应
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /mcp/bundles/{name}:
    post:
      operationId: mcpBundle
      tags:
      - mcp
      summary: 按套件暴露的 MCP 端点
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /mcp/discovery:
    post:
      operationId: mcpDiscovery
      tags:
      - mcp
      summary: 发现模式 MCP：仅 search/get/invoke_capability（danger 不进入）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
components:
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    Health:
      type: object
      properties:
        status:
          enum:
          - ok
          - degraded
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - status
      - service
    TokenRequest:
      type: object
      required:
      - grant_type
      properties:
        grant_type:
          enum:
          - client_credentials
          - urn:ietf:params:oauth:grant-type:jwt-bearer
        assertion:
          type: string
        client_id:
          type: string
        client_assertion_type:
          type: string
        client_assertion:
          type: string
        resource:
          type: string
        scope:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_in:
          type: integer
        scope:
          type: string
      required:
      - access_token
      - token_type
      - expires_in
    ProtectedResourceMetadata:
      type: object
      properties:
        resource:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
      required:
      - resource
      - authorization_servers
    AuthorizationServerMetadata:
      type: object
      properties:
        issuer:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        grant_types_supported:
          type: array
          items:
            type: string
      required:
      - issuer
      - token_endpoint
    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
      required:
      - keys
    CatalogEntry:
      type: object
      properties:
        capability_id:
          type: string
        version:
          type: string
        title:
          type: string
        description:
          type: string
        risk_level:
          type: string
        input_schema:
          type: object
        output_schema:
          type: object
        bundles:
          type: array
          items:
            type: string
          description: 所属套件 name 列表
      required:
      - capability_id
      - version
    InvokeRequest:
      type: object
      properties:
        args:
          type: object
        version:
          type:
          - string
          - 'null'
        channel:
          enum:
          - beta
          - stable
      required:
      - args
    ExecutionResult:
      type: object
      properties:
        execution_id:
          type: string
        status:
          enum:
          - succeeded
          - failed
          - unknown
          - pending_confirm
          - running
          - cancelled
          - compensated
        data: {}
        page:
          type: object
          properties:
            next_cursor:
              type:
              - string
              - 'null'
            truncated:
              type: boolean
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        next_action:
          type:
          - object
          - 'null'
          properties:
            type:
              enum:
              - refresh_auth
              - fix_args
              - request_permission
              - confirm
              - wait
              - reconcile
              - ask_human
            message:
              type: string
            confirmation_id:
              type:
              - string
              - 'null'
            retry_after_s:
              type:
              - integer
              - 'null'
        trace_id:
          type: string
        run_id:
          type: string
          description: Workflow 能力：与 execution_id 相同
      required:
      - execution_id
      - status
      - trace_id
    Run:
      type: object
      properties:
        run_id:
          type: string
        status:
          enum:
          - running
          - waiting
          - succeeded
          - failed
          - compensated
          - rejected
          - cancelled
        result: {}
        error:
          type:
          - object
          - 'null'
        tainted:
          type: boolean
        pending_tasks:
          type: array
          items:
            type: object
        steps:
          type: array
          items:
            type: object
        trace_id:
          type: string
      required:
      - run_id
      - status
    ConfirmRequest:
      type: object
      properties:
        assertion:
          type: string
          description: 被代表用户的新断言（jti 未用过、iat 不早于确认创建）
        comment:
          type: string
        args:
          type: object
          description: 可选：声明所确认的参数，必须与冻结内容一致
    InternalDecision:
      type: object
      properties:
        decision:
          enum:
          - approve
          - reject
        user_id:
          type: string
        comment:
          type: string
        data:
          type: object
      required:
      - decision
      - user_id
