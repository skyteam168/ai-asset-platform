[project]
name = "aip"
version = "0.1.0"
description = "企业 AI 资产管理中台（architecture: docs/architecture.md）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "cryptography>=43",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "redis>=5.2",
    "uuid-utils>=0.9",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.7",
    "sniffio>=1.3",
    "jsonschema>=4.23",
    "tzdata==2026.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "trustme>=1.2",
    "types-jsonschema>=4.23",
    "mcp>=2.3",
]
sdk = [
    "langchain-core>=0.3",
]

[project.optional-dependencies]
sdk = [
    "langchain-core>=0.3",
]
pii = [
    "presidio-analyzer>=2.2",
]

[project.scripts]
corp-skill = "aip.cli.corp_skill:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "infra: needs docker-compose services (python tools/dev.py up)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "TID", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ssl.CERT_NONE".msg = "只允许在 aip.libs.httpclient 中使用（architecture.md 9.6）"
"ssl._create_unverified_context".msg = "禁止关闭证书校验，使用 aip.libs.httpclient.build_client"
"requests".msg = "出站 HTTP 必须经 aip.libs.httpclient"
"urllib3".msg = "出站 HTTP 必须经 aip.libs.httpclient"

[tool.ruff.lint.per-file-ignores]
"src/aip/libs/httpclient/**" = ["TID251", "ASYNC109"]  # 实现 httpcore 网络后端接口，签名含 timeout
"src/aip/libs/common/errors.py" = ["S105"]  # 错误码名称不是口令
"src/aip/libs/common/config.py" = ["S105"]  # 配置项名称与 dev 默认值，prod 校验见 Settings
"src/aip/libs/tokens/secrets_util.py" = ["S105"]
"tests/**" = ["S", "TID251", "ASYNC110", "ASYNC221", "ASYNC240"]
"tools/**" = ["S", "T201", "ASYNC110"]
"migrations/**" = ["E501"]  # SQL DDL
"docs/architecture/reference/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aip"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true
