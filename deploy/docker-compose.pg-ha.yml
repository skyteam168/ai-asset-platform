# 可选 PostgreSQL 主从（architecture.md 12.2）。不改变默认 aip-dev。
#
# 用法（需空卷或先 down -v；与日常开发栈互斥）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.pg-ha.yml --profile pg-ha up -d
# 步骤见 docs/ops/pg-failover.md
#
# 注意：合并本文件会给主库加上 wal_level=replica；仅在演练时叠加本文件。

services:
  postgres:
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=64MB
      - -c
      - hot_standby=on
    volumes:
      - ./pg-ha/primary-init/01-replication.sql:/docker-entrypoint-initdb.d/zz-ha-01-replication.sql:ro
      - ./pg-ha/primary-init/02-pg-hba.sh:/docker-entrypoint-initdb.d/zz-ha-02-pg-hba.sh:ro

  postgres-replica:
    profiles: ["pg-ha"]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: aip-dev-only
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["pgdata_replica:/var/lib/postgresql/data"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          echo "pg-ha: basebackup from primary…"
          until pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R; do
            echo "pg-ha: waiting for primary…"
            sleep 2
          done
          chown -R postgres:postgres /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d aip || pg_isready -U postgres"]
      interval: 3s
      retries: 40

volumes:
  pgdata_replica:
