# 发布前执行迁移（expand / contract：先加后删，旧版本应用在迁移后仍可运行）
apiVersion: batch/v1
kind: Job
metadata:
  name: aip-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: aip
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: aip-config}
            - secretRef: {name: aip-secrets}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
