apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels: {app: control-plane}
spec:
  replicas: 2
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: control-plane
          image: aip
          command: ["uvicorn", "aip.control_plane.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers"]
          ports: [{containerPort: 8080, name: http}]
          envFrom:
            - configMapRef: {name: aip-config}
            - secretRef: {name: aip-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "4", memory: 8Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                            capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}  # Test Lab 临时工作目录
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector: {app: control-plane}
  ports: [{port: 8080, targetPort: http, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-plane
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: control-plane}
