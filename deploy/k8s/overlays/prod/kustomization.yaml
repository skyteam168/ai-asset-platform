apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: ConfigMap, name: aip-config}
    patch: |-
      - op: replace
        path: /data/AIP_ENV
        value: prod
      - op: replace
        path: /data/AIP_RUNTIME_MODE
        value: live
  - target: {kind: StatefulSet, name: data-plane}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
