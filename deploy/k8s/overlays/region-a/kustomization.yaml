# 双机房 region-a（主区示例）。RPO/RTO 与流量切换须集团确认后再改副本与入口。
# 构建：kubectl kustomize deploy/k8s/overlays/region-a
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aip
resources:
  - ../../base
commonLabels:
  aip.region: region-a
  aip.topology: multi-region-draft
patches:
  - target: {kind: ConfigMap, name: aip-config}
    patch: |-
      - op: replace
        path: /data/AIP_ENV
        value: staging
      - op: replace
        path: /data/AIP_RUNTIME_MODE
        value: live
      - op: add
        path: /data/AIP_REGION
        value: region-a
  - target: {kind: StatefulSet, name: data-plane}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
