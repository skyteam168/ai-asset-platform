# 本地开发基础设施（architecture.md 12.1、13）。端口避开常用端口；凭据仅用于 dev。
name: aip-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: aip-dev-only
      POSTGRES_DB: aip
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d aip"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  openbao:
    image: openbao/openbao:2.4.1
    command: ["server", "-dev", "-dev-root-token-id=aip-dev-root-token", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: ["IPC_LOCK"]
    ports: ["127.0.0.1:58200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      retries: 30

  opa:
    image: openpolicyagent/opa:1.10.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info"]
    ports: ["127.0.0.1:58181:8181"]

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:58333:8333"]
    volumes: ["s3data:/data"]

volumes:
  pgdata:
  s3data:
